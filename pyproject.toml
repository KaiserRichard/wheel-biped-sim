[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-biped-sim"
version = "0.1.0"
description = "CPU MuJoCo research simulator for a wheel-biped robot"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mujoco==3.3.7"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["wbr*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
