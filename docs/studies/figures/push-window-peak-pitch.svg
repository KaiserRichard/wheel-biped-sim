<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Dot chart of peak body pitch for 64 standing-push cases. Previous firmware peaks reach 9.33 degrees; with the push window every case stays at or below 1.35 degrees, under the 2 degree limit. No falls in either.">
